<!doctype html>
<html lang="zh-CN" data-theme="zero-hacker">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>CardputerZero Hub</title>
    <meta
      name="description"
      content="A static CardputerZero AppStore registry and responsive app directory for GitHub Pages."
    >
    <link rel="icon" href="assets/20480000/icon.png">
    <link rel="stylesheet" href="site/styles.css">
  </head>
  <body>
    <header class="shell header">
      <a class="brand" href="#/" aria-label="CardputerZero AppStore Home">
        <span class="brand-mark">CZ</span>
        <span>
          <span class="brand-title">CardputerZero Hub</span>
          <span class="brand-subtitle">AppStore & Registry</span>
        </span>
      </a>

      <button class="icon-button nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav" id="nav">
        <a href="#/apps" data-nav="apps">Apps</a>
        <a href="#/submit" data-nav="submit">Submit</a>
        <a href="#/policy" data-nav="policy">Policy</a>
        <a href="#/registry" data-nav="registry">Registry</a>
      </nav>

      <div class="header-actions">
        <label class="visually-hidden" for="locale-select">Language</label>
        <select id="locale-select" class="select compact-select" aria-label="Language">
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </header>

    <main id="app" class="app-shell" tabindex="-1">
      <section class="loading" aria-live="polite">
        <span class="scanline"></span>
        <p>Loading registry...</p>
      </section>
    </main>

    <template id="app-card-template">
      <article class="app-card">
        <a class="app-card-link" href="#">
          <div class="app-card-head">
            <img class="app-icon" alt="">
            <div class="app-title-block">
              <h3></h3>
              <p class="app-author"></p>
            </div>
            <code class="share-code"></code>
          </div>
          <p class="app-summary"></p>
          <div class="badge-row app-categories"></div>
          <div class="badge-row app-signals"></div>
        </a>
      </article>
    </template>

    <script src="site/app.js" defer></script>
  </body>
</html>
